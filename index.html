<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulator ATP | NSN IOH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load file CSS kustom -->
    <link rel="stylesheet" href="style.css">
    <!-- Load Font Inter & Chivo -->
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0a0d14] text-slate-200 font-sans antialiased selection:bg-amber-500 selection:text-black">
    
    <!-- Wrapper Utama: Membatasi lebar di HP (max-w-md), melebar penuh (flex-row) di Desktop -->
    <div class="max-w-md mx-auto md:max-w-none md:mx-0 w-full min-h-screen flex flex-col md:flex-row bg-[#0f141c] shadow-2xl relative">
        
        <!-- PANEL KIRI / ATAS: Kontrol -->
        <aside class="w-full md:w-[380px] lg:w-[420px] flex flex-col shrink-0 bg-[#131b26] border-b md:border-b-0 md:border-r border-slate-800 z-20 md:h-screen md:overflow-y-auto custom-scrollbar">
            <!-- Header -->
            <header class="p-4 border-b border-slate-800 sticky top-0 bg-[#131b26] z-30">
                <h1 class="text-lg font-bold leading-tight text-white">Simulator Label ATP</h1>
                <p class="text-[11px] text-slate-400 mt-1 uppercase tracking-wider font-semibold">Standarisasi NSN - IOH</p>
            </header>

            <!-- Workspace Kontrol -->
            <div class="p-4 flex flex-col gap-5">
                
                <!-- 1A. Pilih Modul (Versi HP: Dropdown Klasik) -->
                <div class="flex flex-col gap-1.5 md:hidden">
                    <label for="module-select" class="text-sm font-bold text-slate-400">Pilih Modul / Unit</label>
                    <select id="module-select" class="p-3 border border-slate-700 rounded-lg bg-slate-800 text-white focus:ring-2 focus:ring-amber-500 focus:outline-none font-medium">
                        <option value="" disabled selected>-- Pilih Perangkat --</option>
                        <option value="FXDD">FXDD / ARDA / ARDB (900 MHz)</option>
                        <option value="AHPDC">AHPDC (700 + 900 MHz)</option>
                        <option value="FXED">FXED / AREA / AREC (1800 MHz)</option>
                        <option value="AHEGG">AHEGC / AHEGG / AHEGH (1800+2100)</option>
                        <option value="FRGU">FRGU / ARGA (2100 MHz)</option>
                        <option value="AKHD">AKHD (2300 MHz / TDD)</option>
                        <option value="AVHA">AVHA (AAU - 2600 MHz)</option>
                        <option value="GPS">Kabel Sync / GPS (FYGE)</option>
                    </select>
                </div>

                <!-- 1B. Pilih Modul (Versi Desktop: Grid Kartu) -->
                <div class="hidden md:flex flex-col gap-3">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Pilih RRU / RF Modul</label>
                    <div id="module-grid-container" class="grid grid-cols-1 gap-2.5">
                        <!-- Tombol Card di-inject via app.js -->
                    </div>
                </div>

                <!-- 2. Area Toggle Dinamis -->
                <div id="dynamic-toggles" class="hidden flex flex-wrap gap-2 p-3 bg-slate-900/50 border border-slate-800 rounded-lg">
                    <!-- Toggles injected here -->
                </div>

                <!-- 3. Tab Kategori Kabel -->
                <div id="main-tabs" class="hidden flex border-b border-slate-800 mt-1">
                    <button class="tab-btn flex-1 py-3 text-sm font-bold text-slate-500 border-b-2 border-transparent transition-colors hover:text-slate-300" data-tab="jumper">Jumper RF</button>
                    <button class="tab-btn flex-1 py-3 text-sm font-bold text-slate-500 border-b-2 border-transparent transition-colors hover:text-slate-300" data-tab="dc">Power DC</button>
                    <button class="tab-btn flex-1 py-3 text-sm font-bold text-slate-500 border-b-2 border-transparent transition-colors hover:text-slate-300" data-tab="fo">Fiber Optik</button>
                </div>

                <!-- 4. Pilihan Sektor -->
                <div id="sector-selection" class="hidden flex gap-2">
                    <button class="sector-btn flex-1 py-2.5 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-sm font-bold transition-all hover:bg-slate-600 hover:text-white" data-sector="1">Sektor 1</button>
                    <button class="sector-btn flex-1 py-2.5 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-sm font-bold transition-all hover:bg-slate-600 hover:text-white" data-sector="2">Sektor 2</button>
                    <button class="sector-btn flex-1 py-2.5 bg-slate-800 text-slate-400 border border-slate-700 rounded-lg text-sm font-bold transition-all hover:bg-slate-600 hover:text-white" data-sector="3">Sektor 3</button>
                </div>

                <!-- Pesan Peringatan Khusus -->
                <div id="warning-message" class="hidden p-3 bg-amber-900/20 border border-amber-800/50 rounded-lg text-sm text-amber-500 font-medium text-center">
                </div>

            </div>
        </aside>

        <!-- PANEL KANAN / BAWAH: Kanvas Visualisasi -->
        <!-- Di HP menggunakan min-h-[500px] agar ruang kabel lega, di Desktop mengikuti h-screen -->
        <main class="flex-1 flex flex-col min-h-[500px] md:h-screen bg-[#0a0d14] relative overflow-hidden">
            <!-- Header Kanvas -->
            <div id="canvas-header" class="text-center text-slate-500 text-[10px] font-bold uppercase tracking-[0.2em] py-4 bg-[#0a0d14]/90 backdrop-blur sticky top-0 z-10 hidden border-b border-slate-800/50">
                Setiap Ujung Konektor (Atas)
            </div>
            
            <!-- Area Render Kabel -->
            <div class="flex-1 overflow-auto custom-scrollbar flex items-center justify-center p-4 sm:p-8">
                <div id="render-area" class="w-full min-h-full flex justify-center items-center transition-all duration-300">
                    <div id="placeholder-text" class="text-slate-600 text-sm text-center max-w-sm p-8 border border-dashed border-slate-800 rounded-2xl">
                        <span class="block text-3xl mb-3 opacity-50">⚡</span>
                        Pilih RRU / RF Modul untuk merender panduan lilitan label kabel.
                    </div>
                </div>
            </div>
        </main>
        
    </div>

<!-- Menjadi ini (naikkan nomor versi setiap kali ada update data): -->
    <script src="data.js?v=1.1"></script>
    <script src="app.js?v=1.1"></script>
</body>
</html>
